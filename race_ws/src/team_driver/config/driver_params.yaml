# Overrides for experiments. A judged run passes NO parameter file
# (`ros2 run team_driver driver`), so the defaults declared in driver.py are
# what races - move anything you settle on there.
#
#   ros2 run team_driver driver --ros-args --params-file \
#       /hackathon/race_ws/src/team_driver/config/driver_params.yaml
#   ./scripts/evaluate.sh --team t --driver-params \
#       /hackathon/race_ws/src/team_driver/config/driver_params.yaml

driver:
  ros__parameters:
    speed_scale: 1.0
